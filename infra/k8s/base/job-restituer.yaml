# Provisionnement de Metabase : connexions, comptes, droits, tableaux de
# bord. Ne touche pas au lake, donc pas de montage Blob. Recréé à chaque
# `ops/cloud.sh restituer`.
apiVersion: batch/v1
kind: Job
metadata:
  name: eds-restituer
  namespace: eds
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: eds-pipeline
    spec:
      restartPolicy: Never
      containers:
        - name: pipeline
          image: __ACR_LOGIN_SERVER__/eds-pipeline:__TAG__
          command: ["python", "-m", "eds.restitution"]
          envFrom:
            - configMapRef: { name: eds-config }
            - secretRef: { name: eds-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eds-keyvault
