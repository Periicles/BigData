[pytest]
testpaths = tests
# `demontrer` et `verifier` ne sont pas des tests pytest : ce sont deux
# programmes qui s'exécutent CONTRE UN ENTREPÔT VIVANT, écrivent dedans et
# le remettent en état. Les laisser être collectés ferait démarrer Docker au
# milieu d'une suite censée tourner en une seconde, hors ligne.
python_files = test_*.py
addopts = -q --strict-markers
