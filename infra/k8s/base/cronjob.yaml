# La nuit du CHU. Ce que `eds.supervision` ajoute à `cron` sur le poste —
# verrou, relance bornée — est ici natif : `concurrencyPolicy: Forbid`
# empêche deux exécutions de se recouvrir, `backoffLimit` relance un échec.
# L'alerte est l'état du Job (`kubectl -n eds get jobs`).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eds-nuit
  namespace: eds
spec:
  schedule: "10 3 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: eds-pipeline
        spec:
          restartPolicy: Never
          containers:
            - name: pipeline
              image: __ACR_LOGIN_SERVER__/eds-pipeline:__TAG__
              command: ["python", "-m", "eds.run"]
              envFrom:
                - configMapRef: { name: eds-config }
                - secretRef: { name: eds-secrets }
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits: { memory: 1Gi }
              volumeMounts:
                - name: source
                  mountPath: /data/source
                  readOnly: true
                - name: lake
                  mountPath: /data/lake
                - name: secrets
                  mountPath: /mnt/secrets
                  readOnly: true
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: source
                readOnly: true
            - name: lake
              persistentVolumeClaim:
                claimName: lake
            - name: secrets
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: eds-keyvault
